<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f7fb"><title>迁移旧学习进度</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}main{max-width:620px;margin:8vh auto;padding:24px;background:white;border:1px solid #e7ebf2;border-radius:18px;box-shadow:0 8px 28px #1d2d520f}h1{font-size:23px;margin:0 0 10px}p{color:#718096;line-height:1.7;font-size:14px}input{display:block;width:100%;margin:22px 0;padding:14px;border:1px solid #dce2eb;border-radius:10px;background:#fff}button{width:100%;border:0;border-radius:10px;padding:13px;background:#315bd6;color:white;font-size:15px;font-weight:700}.note{font-size:12px;background:#f5f7fb;padding:12px;border-radius:10px}</style></head>
<body><main><h1>迁移电脑上的学习记录</h1><p>先在电脑旧版进度表所在的 Chrome 资料中导出 JSON 备份，再在这里选择该文件。数据只写入当前浏览器此网站的本地存储，不会上传到 GitHub。</p><div class="note">如果平板这个网站已经有学习记录，导入前会要求确认覆盖。</div><input id="file" type="file" accept=".json,application/json"><button id="go">验证并导入学习记录</button><p id="status" role="status"></p></main>
<script>
(async()=>{
const $=id=>document.getElementById(id), DB='gaokao_base_learning_tracker_db', STORE='snapshots', RECORD='latest';
const valid=v=>!!(v&&Array.isArray(v.logs)&&typeof v.startDate==='string'&&Number.isFinite(v.cycleDays)&&v.logs.every(l=>l&&typeof l.subjectId==='string'&&Number.isFinite(l.seconds)&&l.seconds>0&&typeof l.date==='string'));
$('go').addEventListener('click',async()=>{
const f=$('file').files[0];if(!f){$('status').textContent='请先选择 JSON 备份文件。';return;}
try{
const pack=JSON.parse(await f.text()),state=pack.state;
if(pack.format!=='gaokao-learning-transfer'||!valid(state))throw new Error('备份格式不正确或数据校验未通过。');
const rawOld=localStorage.getItem('gaokao_base_learning_tracker_v1');let oldCount=0;try{oldCount=rawOld?(JSON.parse(rawOld).logs||[]).length:0}catch(e){}
if(!confirm('将导入 '+state.logs.length+' 条记录；本平板当前有 '+oldCount+' 条记录。确认覆盖吗？'))return;
state.updatedAt=Date.now();const raw=JSON.stringify(state);
localStorage.setItem('gaokao_base_learning_tracker_v1',raw);
localStorage.setItem('gaokao_base_learning_tracker_backup_v1',raw);
const db=await new Promise((resolve,reject)=>{const req=indexedDB.open(DB,1);req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains(STORE))req.result.createObjectStore(STORE)};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)});
await new Promise((resolve,reject)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put(state,RECORD);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error)});
db.close();$('status').textContent='导入成功，正在返回进度表……';setTimeout(()=>location.href='./',700);
}catch(e){$('status').textContent='导入失败：'+e.message;}
});
})();
</script></body></html>
